{% if include.id %}
  {% assign gallery = page[include.id] %}
{% else %}
  {% assign gallery = page.gallery %}
{% endif %}

<div class="gallery-grid">
  {% for img in gallery %}
    <figure class="gallery-item">
      {% if img.url %}
        <a href="{% if img.url contains '://' %}{{ img.url }}{% else %}{{ img.url | prepend: '/images/' | prepend: base_path }}{% endif %}" title="{{ img.title | default: img.caption }}">
          <img src="{{ img.image_path | prepend: '/images/' | prepend: base_path }}" alt="{{ img.alt | default: img.title | default: img.caption }}">
        </a>
      {% else %}
        <img src="{{ img.image_path | prepend: '/images/' | prepend: base_path }}" alt="{{ img.alt | default: img.title | default: img.caption }}">
      {% endif %}
      
      {% if img.caption or img.title %}
        <figcaption class="gallery-caption">{{ img.caption | default: img.title }}</figcaption>
      {% endif %}
    </figure>
  {% endfor %}
</div>

<style>
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  margin: 1.5rem 0;
}
.gallery-item {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #e1e4e8;
}
.gallery-item img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}
.gallery-caption {
  padding: 0.75rem 1rem;
  font-size: 0.85rem;
  line-height: 1.4;
  color: #4a5568;
  text-align: center;
  background: #fafbfc;
  border-top: 1px solid #f0f3f6;
  flex-grow: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
